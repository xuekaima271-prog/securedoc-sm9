# =============================================================================
# 演示档(prod)：本机 MySQL 8，KGC 用独立库 securedoc_kgc（与 dev 双 H2 拓扑一致）
#
# ⚠ 为什么不共库（真 MySQL 联调实证，2026-07-09）：
#   1) 后端 createUser 事务内同步调 KGC 登记 → KGC 补影子行撞后端未提交行锁
#      → 分布式死锁（HTTP 等 DB、DB 等 HTTP），超时 503 且留脏影子行（USER-1 实锤）；
#   2) KGC 审计行无 SM3 哈希链字段，混入共享 audit_logs 会使后端 verifyChain 全链失败。
#   独立库下两问题天然消失；跨库身份一致性由 register-identity 幂等登记保证。
#
# 启动：./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
# init.mode=never：库由 deploy 脚本初始化，KGC 启动不重置数据
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/securedoc_kgc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never

# 生产档不得沿用开发令牌或主密钥口令；缺少任一环境变量会拒绝启动。
kgc:
  service-token: ${KGC_SERVICE_TOKEN}
  master-key:
    passphrase: ${KGC_MASTER_PASSPHRASE}
