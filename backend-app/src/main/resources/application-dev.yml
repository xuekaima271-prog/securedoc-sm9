# =============================================================================
# 开发档(dev)：H2 内存数据库 + MySQL 兼容模式，零安装
# 启动时自动执行 ../database/schema.sql 与 ../database/init_data.sql
# 运行目录约定：在 backend-app/ 下执行 `./mvnw spring-boot:run`（故用 ../database 相对路径）
# =============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:securedoc;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always            # 每次启动重建（H2内存库本就每次全新）
      encoding: UTF-8         # 关键：脚本含中文，必须 UTF-8，否则乱码（已实测）
      schema-locations: file:../database/schema.sql
      data-locations: file:../database/init_data.sql
      continue-on-error: false
  h2:
    console:
      enabled: ${SECUREDOC_H2_CONSOLE_ENABLED:false} # 显式设 true 才为本机调试打开
      path: /h2-console
