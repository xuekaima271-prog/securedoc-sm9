# =============================================================================
# 演示档(prod)：本机安装的 MySQL 8（答辩演示用），免 Docker
# 建库（一次性）：CREATE DATABASE securedoc DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# 初始化由 deploy 脚本手动执行 schema.sql / init_data.sql，故此处 init.mode=never，避免每次启动重置数据
# 启动：./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/securedoc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never             # MySQL 由 deploy 脚本初始化，启动不重置
  h2:
    console:
      enabled: false          # SEC：演示/生产档禁用 H2 控制台

# SEC-4：演示/生产档日志降级——DEBUG 会打印 SQL 参数（含审计详情、限流记录等），prod 必须 INFO
logging:
  level:
    com.securedoc.app: info
    org.springframework.security: warn

server:
  servlet:
    session:
      cookie:
        http-only: true       # 会话 Cookie 防脚本窃取
        same-site: lax        # 缓解 CSRF（配合 SEC-1 决策；生产建议 strict + CSRF Token）

# 生产档不得回退到开发令牌或 MinIO 默认凭据；缺少任一环境变量会拒绝启动。
securedoc:
  kgc:
    token: ${KGC_SERVICE_TOKEN}
  storage:
    minio:
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}

# M-3：审计链 HMAC 密钥同样无兜底，缺 AUDIT_HMAC_KEY 即拒绝启动（不得回退 dev 默认值）。
app:
  audit:
    hmac-key: ${AUDIT_HMAC_KEY}
